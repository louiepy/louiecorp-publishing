name: LouieCorp Newsroom

on:
  schedule:
    - cron: '0 5 * * *'
    - cron: '0 11 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Check out LouieCorp
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF library
        run: |
          python -m pip install --upgrade pip
          pip install fpdf2 pillow

      - name: Verify media bot secret is present
        env:
          MEDIA_BOT_SECRET: ${{ secrets.MEDIA_BOT_SECRET }}
        run: |
          if [ -z "${MEDIA_BOT_SECRET}" ]; then
            echo "GitHub Actions secret MEDIA_BOT_SECRET is missing." >&2
            exit 1
          fi

      - name: Run newsroom
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEWSROOM_EDITOR_USER_ID: ${{ secrets.NEWSROOM_EDITOR_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MEDIA_WORKER_URL: ${{ secrets.MEDIA_WORKER_URL }}
          MEDIA_BOT_SECRET: ${{ secrets.MEDIA_BOT_SECRET }}
          AUTO_PUBLISH: "true"
        run: python -m newsroom.main